<!DOCTYPE html>

<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Smash House — Menu</title>

  <meta
    name="description"
    content="Explore the Smash House menu and discover delicious meals, favourites and more. Visit us in Masaki or order your favourites online."
  />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="style1.css"
  />

</head>


<body>


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header class="site-header">

    <div class="header-inner">


      <!-- Restaurant Logo -->

      <div class="brand-logo">

        <img
          src="logo.jpeg"
          alt="Smash House logo"
        />

      </div>


      <!-- Restaurant Name -->

      <div class="brand-copy">

        <p class="brand-eyebrow">
          Smash House
        </p>

        <h1 class="brand-name">
          Our Menu
        </h1>

        <p class="brand-tagline">
          Every taste is a hit.
        </p>

      </div>


      <!-- Home Button -->

      <a
        href="index.html"
        class="home-button"
        aria-label="Go back to Smash House home page"
      >
        🏠 Home
      </a>


    </div>
    

  </header>



  <!-- =========================================================
       CATEGORY NAVIGATION
       ========================================================= -->

  <nav
    class="category-nav"
    aria-label="Menu categories"
  >

    <div
      class="category-nav-scroll"
      id="category-nav"
      role="tablist"
    ></div>

  </nav>



  <!-- =========================================================
       MENU CONTENT
       ========================================================= -->

  <main
    id="menu-content"
    class="menu-content"
  >

    <!--
      Menu category sections are rendered here
      by script1.js from MENU_DATA.
    -->

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <footer class="site-footer">

    <div class="footer-inner">

      <div class="footer-brand">

        <p class="footer-name">
          Smash House
        </p>

        <p class="footer-tagline">
          Every taste is a hit.
        </p>

      </div>


      <div class="footer-details">

        <p>
          📍 Masaki, Opposite Jambo Supermarket
        </p>

        <p>
          📞
          <a href="tel:0753005002">
            0753 005 002
          </a>
        </p>

        <p>
          🛵 Home delivery available
        </p>

        <p>
          🕛 Open Monday–Sunday · Closed Tuesdays · 2 PM–2 AM
        </p>

      </div>

    </div>


    <!-- Copyright -->

    <p class="footer-copyright">

      © <span id="year"></span>
      Smash House.
      All prices in Tanzanian Shillings.

    </p>

  </footer>



  <!-- JavaScript -->

  <script src="script1.js"></script>

</body>
</html>
